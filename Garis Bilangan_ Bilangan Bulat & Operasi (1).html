<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garis Bilangan: Bilangan Bulat & Operasi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8fc;--card:#fff;--tx:#1b2733;--mut:#5d6b78;--ln:#8b99a6;--a:#1f6fd1;--b:#e8780c;--r:#16a34a;--neg:#d6336c;--bd:#d5dee7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171f;--card:#19232d;--tx:#e8eef4;--mut:#9aa9b7;--ln:#6f7f8d;--a:#5aa2ff;--b:#ffa04d;--r:#4ade80;--neg:#ff7aa8;--bd:#2c3a47}}
:root[data-theme="dark"]{--bg:#10171f;--card:#19232d;--tx:#e8eef4;--mut:#9aa9b7;--ln:#6f7f8d;--a:#5aa2ff;--b:#ffa04d;--r:#4ade80;--neg:#ff7aa8;--bd:#2c3a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 4px}p.sub{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:1rem;cursor:pointer}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.scroll{overflow-x:auto}svg{display:block;min-width:640px;width:100%;touch-action:none;user-select:none}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.step{display:flex;align-items:center;gap:6px}.step b{min-width:2.4em;text-align:center;font-size:1.3rem}
.step button,.op button{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1.2rem;cursor:pointer}
.op button{border-radius:10px;width:auto;padding:0 16px}.op button.on{background:var(--b);color:#fff;border-color:var(--b)}
label{cursor:pointer}.eq{font-size:1.7rem;font-weight:700;text-align:center;margin:6px 0}.note{color:var(--mut);text-align:center;font-size:.95rem;min-height:3em}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.info div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.info span{display:block;color:var(--mut);font-size:.8rem}.info b{font-size:1.4rem}
</style></head><body><main>
<h1>Garis Bilangan</h1><div class="tabs"><button id="t1" class="on">Bilangan Bulat</button><button id="t2">Operasi</button></div>
<div class="card scroll"><svg id="s" viewBox="0 0 840 220"></svg></div>
<div class="card" id="ctl"></div>
<script>
const X0=20,U=20,Y=170;const px=v=>X0+(v+20)*U;
let tab=1,x=3,showOpp=true,showAbs=true,a=4,b=-6,op='+';
const svg=document.getElementById('s'),ctl=document.getElementById('ctl');
const cl=(v,m)=>Math.max(-m,Math.min(m,v));
function dir(v){return v>=0?'kanan':'kiri'}
function arrow(v1,v2,y,c,label){if(v1===v2)return'';return `<line x1="${px(v1)}" y1="${y}" x2="${px(v2)+(v2>v1?-6:6)}" y2="${y}" stroke="var(--${c})" stroke-width="4"/>
<polygon points="${px(v2)},${y} ${px(v2)+(v2>v1?-12:12)},${y-7} ${px(v2)+(v2>v1?-12:12)},${y+7}" fill="var(--${c})"/>
<text x="${(px(v1)+px(v2))/2}" y="${y-10}" text-anchor="middle" fill="var(--${c})" font-weight="700" font-size="15">${label}</text>
<line x1="${px(v1)}" y1="${y}" x2="${px(v1)}" y2="${Y}" stroke="var(--${c})" stroke-dasharray="3 3" opacity=".5"/>`}
function dot(v,c,r=9){return `<circle cx="${px(v)}" cy="${Y}" r="${r}" fill="var(--${c})" stroke="#fff" stroke-width="2"/>`}
function base(){let s=`<line x1="${X0-8}" y1="${Y}" x2="${px(20)+8}" y2="${Y}" stroke="var(--ln)" stroke-width="3"/>`;
for(let v=-20;v<=20;v++){const m=v%5===0||v===0;s+=`<line x1="${px(v)}" y1="${Y}" x2="${px(v)}" y2="${Y+(m?14:8)}" stroke="var(--ln)" stroke-width="${v===0?3:1.5}"/>`;
if(v%2===0)s+=`<text x="${px(v)}" y="${Y+32}" text-anchor="middle" font-size="13" fill="var(--tx)">${v}</text>`}
return s}
function draw(){let s=base();
if(tab===1){
 if(showAbs&&x!==0)s+=`<path d="M${px(0)} ${Y-22} V${Y-30} H${px(x)} V${Y-22}" fill="none" stroke="var(--b)" stroke-width="3"/><text x="${(px(0)+px(x))/2}" y="${Y-38}" text-anchor="middle" fill="var(--b)" font-weight="700">|${x}| = ${Math.abs(x)}</text>`;
 if(showOpp&&x!==0)s+=dot(-x,'neg',8)+`<text x="${px(-x)}" y="${Y-16}" text-anchor="middle" fill="var(--neg)" font-size="13">lawan</text>`;
 s+=dot(0,'ln',4)+dot(x,'a',12);
 s+=`<text x="${px(x)}" y="${Y-92}" text-anchor="middle" fill="var(--a)" font-weight="700" font-size="20">${x}</text>`;
}else{
 const m=op==='+'?b:-b,r=a+m;
 s+=arrow(0,a,125,'a',a>=0?'+'+a:a)+arrow(a,r,75,'b',(op==='+'?'+':'−')+'('+b+') ⇒ '+(m>=0?'+':'')+m);
 s+=dot(0,'ln',5)+dot(a,'a',7)+dot(r,'r',11);
 s+=`<text x="${px(r)}" y="${Y+58}" text-anchor="middle" fill="var(--r)" font-weight="700" font-size="18">hasil ${r}</text>`}
svg.innerHTML=s}
function ui(){
if(tab===1){ctl.innerHTML=`<div class="row"><div class="step"><button data-d="-1">−</button><b>${x}</b><button data-d="1">+</button></div>
<label><input type="checkbox" id="co" ${showOpp?'checked':''}> Tampilkan lawan</label><label><input type="checkbox" id="ca" ${showAbs?'checked':''}> Tampilkan nilai mutlak</label></div>
<p class="note" style="margin:6px 0 0">Geser titik biru pada garis bilangan atau gunakan tombol.</p>
<div class="info"><div><span>Bilangan</span><b>${x}</b></div><div><span>Lawan</span><b>${-x}</b></div><div><span>Nilai mutlak</span><b>${Math.abs(x)}</b></div><div><span>Jenis</span><b style="font-size:1rem">${x>0?'Positif':x<0?'Negatif':'Nol'}</b></div></div>`;
 ctl.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{x=cl(x+ +e.dataset.d,20);ui();draw()});
 document.getElementById('co').onchange=e=>{showOpp=e.target.checked;draw()};document.getElementById('ca').onchange=e=>{showAbs=e.target.checked;draw()};
}else{
 const m=op==='+'?b:-b,r=a+m,bs=b<0?`(${b})`:b;
 let note=op==='+'?`Mulai di 0, bergerak ${Math.abs(a)} ke ${dir(a)}, lalu menambah ${b} berarti bergerak ${Math.abs(b)} ke ${dir(b)}.`
 :`Mengurangi ${b} sama dengan menambah lawannya (${-b}), jadi bergerak ${Math.abs(b)} ke ${dir(-b)}.`;
 ctl.innerHTML=`<div class="row"><div class="step">a <button data-k="a" data-d="-1">−</button><b style="color:var(--a)">${a}</b><button data-k="a" data-d="1">+</button></div>
<div class="op"><button data-o="+" class="${op==='+'?'on':''}">+</button> <button data-o="-" class="${op==='-'?'on':''}">−</button></div>
<div class="step">b <button data-k="b" data-d="-1">−</button><b style="color:var(--b)">${b}</b><button data-k="b" data-d="1">+</button></div></div>
<div class="eq">${a} ${op==='+'?'+':'−'} ${bs} = <span style="color:var(--r)">${r}</span></div><p class="note">${note}</p>`;
 ctl.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{const k=e.dataset.k,d=+e.dataset.d;if(k==='a')a=cl(a+d,10);else b=cl(b+d,10);ui();draw()});
 ctl.querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>{op=e.dataset.o;ui();draw()})}}
let drag=false;
function move(ev){const r=svg.getBoundingClientRect();const v=Math.round(((ev.clientX-r.left)/r.width*840-X0)/U-20);x=cl(v,20);ui();draw()}
svg.addEventListener('pointerdown',e=>{if(tab===1){drag=true;svg.setPointerCapture(e.pointerId);move(e)}});
svg.addEventListener('pointermove',e=>{if(drag)move(e)});svg.addEventListener('pointerup',()=>drag=false);
function setTab(n){tab=n;t1.className=n===1?'on':'';t2.className=n===2?'on':'';ui();draw()}
t1.onclick=()=>setTab(1);t2.onclick=()=>setTab(2);setTab(1);
</script></main></body></html>
